# Prometheus alert rules for Helix Support (Phase 30.1)
# Scrape target: GET /api/system/metrics (JSON) via a textfile/relabel exporter,
# or the OTel metrics endpoint when configured. Adjust expressions to match
# your scrape path.

groups:
  - name: helix-support
    rules:
      - alert: HelixHigh5xxRate
        expr: |
          (sum(rate(helix_http_requests_total{status=~"5.."}[5m]))
           / clamp_min(sum(rate(helix_http_requests_total[5m])), 1))
          > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx rate on Helix Support"
          description: "5xx share exceeded 2% over 5 minutes."

      - alert: HelixQueueBacklog
        expr: helix_turn_jobs_oldest_queued_age_seconds > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Turn queue backlog"
          description: "Oldest queued turn job is older than 30s; consumers may be slow."

      - alert: HelixTurnP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(helix_http_request_duration_ms_bucket{route="/api/conversations/{conversation_id}/messages"}[5m])) by (le))
          > 4000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Turn P95 latency above SLO"
          description: "P95 message-turn latency exceeded 4s over 5 minutes."

      - alert: HelixErrorBudgetConsumed
        expr: |
          (1 - (sum(rate(helix_http_requests_total{status!~"5.."}[30d]))
                / clamp_min(sum(rate(helix_http_requests_total[30d])), 1)))
          >= 0.001
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Availability error budget nearly consumed"
          description: "Rolling 30d availability below 99.9% SLO."
