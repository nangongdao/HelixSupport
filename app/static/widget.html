<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Helix Support</title>
    <link rel="icon" href="/static/favicon.svg?v=1.3.8" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Josefin+Sans:wght@300;400;600;700&display=swap"
    />
    <link rel="stylesheet" href="/static/css/tokens.css?v=1.3.8" />
    <link rel="stylesheet" href="/static/widget.css?v=1.3.8" />
  </head>
  <body data-accent="teal">
    <main class="widget-frame" aria-labelledby="widgetBrand">
      <div class="widget-glow" aria-hidden="true"></div>
      <header class="widget-header">
        <div class="brand-lockup">
          <img class="brand-mark" src="/static/favicon.svg?v=1.3.8" alt="" width="34" height="34" />
          <div>
            <div class="brand-name" id="widgetBrand">Helix Support</div>
            <div class="brand-status"><span class="status-dot" aria-hidden="true"></span><span id="onlineLabel">在线</span></div>
          </div>
        </div>
        <span class="header-kicker" id="headerKicker">在线服务台</span>
      </header>

      <section class="widget-body" id="prechatView" aria-labelledby="welcomeTitle">
        <div class="welcome-mark" aria-hidden="true"><span>✦</span></div>
        <p class="eyebrow" id="welcomeEyebrow">在线服务台</p>
        <h1 id="welcomeTitle">欢迎来到服务台</h1>
        <p class="welcome-copy" id="welcomeCopy">你好，我是服务助手。告诉我你正在处理什么，我们一起找到下一步。</p>
        <form id="startForm" class="start-form">
          <label for="customerName" id="nameLabel">怎么称呼你？（可选）</label>
          <input id="customerName" name="customer_name" maxlength="80" autocomplete="name" placeholder="例如：林晓" />
          <button class="primary-button" type="submit" id="startButton">开始对话<span aria-hidden="true">↗</span></button>
        </form>
        <p class="privacy-note"><span aria-hidden="true">◌</span><span id="introCopy">你的消息会安全地送到服务团队。</span></p>
      </section>

      <section class="widget-body chat-body" id="chatView" hidden aria-labelledby="chatTitle">
        <h1 class="sr-only" id="chatTitle">服务对话</h1>
        <div class="connection-banner" id="connectionBanner" role="status" hidden></div>
        <div class="message-scroller" id="messageScroller">
          <div class="message-log" id="messageLog" role="log" aria-live="polite" aria-relevant="additions"></div>
        </div>
        <form id="messageForm" class="message-form">
          <label for="messageInput" class="sr-only" id="inputLabel">发送消息</label>
          <div class="composer-shell">
            <textarea id="messageInput" rows="1" maxlength="4000" placeholder="输入你的问题…" required></textarea>
            <button class="send-button" type="submit" id="sendButton" aria-label="发送" title="发送"><span aria-hidden="true">↑</span></button>
          </div>
          <div class="composer-meta"><span id="composerState"></span><span id="poweredLabel">由 Helix Support 提供支持</span></div>
        </form>
      </section>

      <section class="widget-state" id="fatalState" hidden role="alert">
        <div class="state-icon" aria-hidden="true">!</div>
        <h1 id="fatalTitle">聊天链接不可用</h1>
        <p id="fatalCopy">这条聊天链接已失效，请重新打开服务入口。</p>
      </section>
    </main>
    <script type="module" src="/static/widget-app.js?v=1.3.8"></script>
  </body>
</html>
